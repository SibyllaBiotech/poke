[build-system]
requires = ["setuptools>=77"]   # 77 introduced the SPDX licence fields below
build-backend = "setuptools.build_meta"

[project]
name = "poke-scouter"
description = "Pocket scouting engine for protein structures and molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sibylla Biotech", email = "computationals@sibyllabiotech.it"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
keywords = ["binding pocket", "druggability", "ligandability", "molecular dynamics", "protein structure"]
dynamic = ["version"]

dependencies = [
    "numpy",
    "numba",
    "mdanalysis>=2.8",
    "rich"
]

[project.urls]
Homepage = "https://github.com/SibyllaBiotech/poke"
Documentation = "https://sibyllabiotech.github.io/poke-docs/"
Source = "https://github.com/SibyllaBiotech/poke"
Issues = "https://github.com/SibyllaBiotech/poke/issues"
Paper = "https://doi.org/10.1021/acsomega.6c04816"

[project.scripts]
poke = "poke.main:main"

[tool.setuptools]
packages = ["poke", "poke.preparator", "poke.charmm36m"]   # charmm36m holds data files only
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "poke.__version__"}

[tool.setuptools.package-data]
poke = ["model.pickle"]
"poke.charmm36m" = ["*.json", "*.csv"]
